[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lilian-van-chunking_recall_impact_length_profile"
version = "0.1.0"
description = "按段落统计Agent 编排平台工程师·分块策略对召回的影响相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lilian-van" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lilian-van.github.io"
Repository = "https://github.com/lilian-van/chunking_recall_impact_length_profile"
Issues = "https://github.com/lilian-van/chunking_recall_impact_length_profile/issues"

[project.scripts]
chunking_recall_impact_length_profile = "chunking_recall_impact_length_profile:main"

[tool.setuptools]
py-modules = ["chunking_recall_impact_length_profile"]
